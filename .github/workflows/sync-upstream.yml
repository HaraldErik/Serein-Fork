# Keeps this fork up to date with ViceVerse-cz/Serein automatically.
#
# Every 6 hours (and on demand from the Actions tab) it:
#   1. merges upstream `main` into this fork's `main` (a normal merge commit; fork changes are kept),
#   2. merges `main` into the long-lived `plugins` branch so extension work stays current.
# Nothing is force-pushed. If a merge has conflicts, or GitHub refuses it (upstream changed a
# workflow file and the token lacks the `workflow` scope), it opens one issue explaining what to do
# and leaves the branches untouched.
#
# Optional secret SYNC_TOKEN: a token with `repo` + `workflow` scope. Without it the built-in
# token is used, which cannot merge upstream commits that modify .github/workflows/.
name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'HaraldErik/Serein-Fork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge upstream main into main
        id: upstream
        run: |
          set -u
          if out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch=main 2>&1); then
            echo "$out"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            {
              echo "ok=false"
              echo "step=upstream → main"
              echo "detail<<EOF"
              echo "$out"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into plugins
        id: plugins
        if: steps.upstream.outputs.ok == 'true'
        run: |
          set -u
          if ! gh api "repos/$REPO/branches/plugins" > /dev/null 2>&1; then
            echo "No plugins branch; nothing to do."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 201 = merged, 204 = already up to date; anything else is reported.
          if out=$(gh api -X POST "repos/$REPO/merges" -f base=plugins -f head=main \
              -f commit_message="Merge main into plugins (automatic upstream sync)" -i 2>&1); then
            echo "$out" | head -1
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            {
              echo "ok=false"
              echo "step=main → plugins"
              echo "detail<<EOF"
              echo "$out" | tail -5
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report a sync that needs help
        if: steps.upstream.outputs.ok == 'false' || steps.plugins.outputs.ok == 'false'
        env:
          STEP: ${{ steps.upstream.outputs.step || steps.plugins.outputs.step }}
          DETAIL: ${{ steps.upstream.outputs.detail || steps.plugins.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="Upstream sync needs help"
          case "$DETAIL" in
            *workflow*) why="GitHub refused the merge because upstream changed a file in .github/workflows/ and the token has no \`workflow\` permission. Add a repository secret named SYNC_TOKEN (a token with repo + workflow scope), then re-run this workflow." ;;
            *409*|*onflict*) why="The merge has conflicts between upstream and this fork's changes. Merge it manually (for example: git fetch upstream && git merge upstream/main), fix the conflicts and push." ;;
            *) why="The merge failed for another reason; see the details and the run log." ;;
          esac
          body=$(printf 'Step: **%s**\n\n%s\n\nRun: %s\n\n```\n%s\n```\n\nThe branches were left unchanged. This issue is reused while it stays open.' "$STEP" "$why" "$RUN_URL" "$DETAIL")
          existing=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
          exit 1
