# Keeps this fork up to date with ViceVerse-cz/Serein automatically.
#
# Every 6 hours (and on demand from the Actions tab) it:
#   1. merges upstream `main` into this fork's `main` (a normal merge commit; fork changes are kept),
#   2. merges `main` into the long-lived `plugins` branch so extension work stays current.
# It uses plain git (fetch, merge, push), never force-pushes, and keeps the fork's README.md when
# upstream edits it. If a merge has other conflicts it stops, leaves the branches untouched and
# explains what to do in the run summary; GitHub emails the owner about failed scheduled runs.
#
# Secret SYNC_TOKEN: a fine-grained token with Contents + Workflows read/write on this repository.
# (GitHub's built-in token cannot push upstream changes to .github/workflows/, and the REST
# "sync fork" endpoint rejects fine-grained tokens, so the sync is done with git instead.)
name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'HaraldErik/Serein-Fork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream main into main, then main into plugins
        id: sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "serein-fork-sync[bot]"
          git config user.email "serein-fork-sync@users.noreply.github.com"
          # README.md is the fork's own; keep it when upstream changes it.
          echo "README.md merge=ours" >> .git/info/attributes
          git config merge.ours.driver true
          git remote add upstream https://github.com/ViceVerse-cz/Serein.git
          git fetch --no-tags upstream main

          fail() {
            {
              echo "## Upstream sync needs help"
              echo
              echo "Step: **$1**"
              echo
              echo "$2"
              echo
              echo "The branches were left unchanged."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Upstream sync needs help::$1: $2"
            exit 1
          }

          behind=$(git rev-list --count HEAD..upstream/main)
          echo "main is $behind commit(s) behind upstream"
          if [ "$behind" -gt 0 ]; then
            if ! git merge --no-edit -m "Merge upstream ViceVerse-cz/Serein main (automatic sync)" upstream/main; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
              git merge --abort
              fail "upstream → main" "Upstream and this fork changed the same lines in:"$'\n'"$files"$'\n\n'"Merge by hand (git fetch upstream && git merge upstream/main), fix the conflicts and push."
            fi
            git push origin HEAD:main || fail "push main" "Pushing failed. Check that SYNC_TOKEN exists and has Contents and Workflows read/write on this repository."
            echo "- Merged $behind upstream commit(s) into **main**." >> "$GITHUB_STEP_SUMMARY"
          else
            # Proves the token can still push, so a broken token is noticed before it matters.
            if ! git push --dry-run origin HEAD:main; then
              # Ask GitHub which permission the token lacks (prints response headers, never the token).
              probe=$(curl -s -o /dev/null -D - -X POST \
                -H "Authorization: Bearer $SYNC_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
                -d "{\"ref\":\"refs/heads/sync-token-probe\",\"sha\":\"$(git rev-parse HEAD)\"}" \
                | grep -i -E '^HTTP/|x-accepted-github-permissions|github-authentication-token-expiration' || true)
              echo "$probe"
              case "$probe" in *" 201"*)
                curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $SYNC_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/sync-token-probe" ;;
              esac
              fail "token check" "SYNC_TOKEN cannot push to this repository. GitHub's answer:"$'\n```\n'"$probe"$'\n```'
            fi
            echo "- **main** is already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
          fi

          if git ls-remote --exit-code --heads origin plugins > /dev/null; then
            git fetch --no-tags origin plugins
            git checkout -q -B plugins origin/plugins
            if git merge-base --is-ancestor main plugins; then
              echo "- **plugins** already contains main." >> "$GITHUB_STEP_SUMMARY"
            else
              if ! git merge --no-edit -m "Merge main into plugins (automatic upstream sync)" main; then
                files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
                git merge --abort
                fail "main → plugins" "main and plugins changed the same lines in:"$'\n'"$files"$'\n\n'"Merge main into plugins by hand and push."
              fi
              git push origin plugins || fail "push plugins" "Pushing plugins failed; check SYNC_TOKEN."
              echo "- Merged **main** into **plugins**." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
